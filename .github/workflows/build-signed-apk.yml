name: Build signed PyPath APK

# ONE workflow that:
#   1. Builds the PyPath debug APK from the backend-integration branch (or the branch you choose).
#   2. Signs it with YOUR key, decoded from the base64 keystore in your GitHub secrets.
#   3. Prints the package name, SHA-1 and SHA-256 (of the key and of the finished APK) in the log
#      and the run Summary, and checks that they match.
#   4. Uploads the signed APK as an artifact and (by default) to a GitHub Release for easy download.
#
# Secrets (Settings > Secrets and variables > Actions). ONLY the base64 one is required:
#   ANDROID_KEYSTORE_BASE64    your keystore file as base64 (DEBUG_KEYSTORE_BASE64, KEYSTORE_BASE64
#                              or SIGNING_KEY_BASE64 also work)
#   ANDROID_KEYSTORE_PASSWORD  optional. If not set, the standard debug password "android" is used
#   ANDROID_KEY_ALIAS          optional. If not set: androiddebugkey, else the first key in the file
#   ANDROID_KEY_PASSWORD       optional. If not set, the keystore password is used
# Passwords and the key file are never printed. The decoded key file is deleted at the end.
# This file contains NO backslashes, so it survives copy and paste on a phone.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        type: string
        default: "backend-integration"
      publish_release:
        description: "Also put the signed APK on a GitHub Release (easy phone download)"
        type: boolean
        default: true
  push:
    branches:
      - backend-integration
    paths:
      - "PyPath/**"
      - ".github/workflows/build-signed-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-signed-apk-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

env:
  BUILD_BRANCH: ${{ inputs.branch || 'backend-integration' }}
  PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}

jobs:
  build:
    name: Build, sign and fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the branch to build
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}

      - name: Check the project
        run: |
          set -euo pipefail
          for f in PyPath/gradlew PyPath/settings.gradle.kts PyPath/app/build.gradle.kts PyPath/app/src/main/AndroidManifest.xml; do
            [ -f "$f" ] || { echo "::error::$f is missing on branch $BUILD_BRANCH"; exit 1; }
          done
          chmod +x PyPath/gradlew
          echo "Building branch $BUILD_BRANCH at commit $(git rev-parse --short HEAD)"
          grep -nE "applicationId|versionCode|versionName|abiFilters" PyPath/app/build.gradle.kts
          echo "--- Google Web client ID in this build:"
          grep -h "google_web_client_id" PyPath/app/src/main/res/values/google_auth.xml || echo "(google_auth.xml not found)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing key from secrets
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/pypath-signing"
          mkdir -p "$dir"
          ks="$dir/release.keystore"
          # Use the first base64 secret that exists.
          src=""
          b64=""
          for n in ANDROID_KEYSTORE_BASE64 DEBUG_KEYSTORE_BASE64 KEYSTORE_BASE64 SIGNING_KEY_BASE64; do
            if [ -n "${!n:-}" ]; then src="$n"; b64="${!n}"; break; fi
          done
          if [ -z "$src" ]; then
            echo "::error::No base64 keystore secret found. Name it ANDROID_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if ! printf "%s" "$b64" | tr -d "[:space:]" | base64 --decode > "$ks" 2> /dev/null || [ ! -s "$ks" ]; then
            echo "::error::$src is not valid base64. Make it with: base64 -w0 your.keystore"
            exit 1
          fi
          echo "Decoded $src: $(wc -c < "$ks") bytes"

          # Password: the password secret if you have one, otherwise the standard debug password "android".
          store_pw=""
          for pw in "${ANDROID_KEYSTORE_PASSWORD:-}" "${KEYSTORE_PASSWORD:-}" android; do
            [ -n "$pw" ] || continue
            if KS_PW="$pw" keytool -list -keystore "$ks" -storepass:env KS_PW > "$dir/list.txt" 2> /dev/null; then
              store_pw="$pw"
              break
            fi
          done
          if [ -z "$store_pw" ]; then
            echo "::error::Could not open the keystore in $src: it needs a password, and it is not the standard debug password android."
            echo "::error::Add the password as the secret ANDROID_KEYSTORE_PASSWORD, or make a new key (see the run Summary)."
            {
              echo "## The keystore needs its password"
              echo ""
              echo "The base64 in $src decoded fine, but the keystore is locked with a password that is not android."
              echo "Add a secret ANDROID_KEYSTORE_PASSWORD with that password and run again."
              echo "If nobody knows the password, the key cannot sign anything: make a new key and register its SHA-1 instead."
            } >> "$GITHUB_STEP_SUMMARY"
            # A JKS file still shows its fingerprints without the password (for information only).
            printf "" | keytool -list -v -keystore "$ks" 2> /dev/null | grep -E "Alias name|SHA1:|SHA256:" || true
            exit 1
          fi
          export KS_PW="$store_pw"

          # Alias: the alias secret, else androiddebugkey, else the first key in the file.
          alias="${ANDROID_KEY_ALIAS:-}"
          if [ -z "$alias" ]; then
            if grep -qi "^androiddebugkey," "$dir/list.txt"; then
              alias=androiddebugkey
            else
              alias=$(awk -F, '/PrivateKeyEntry/ { print $1; exit }' "$dir/list.txt")
            fi
            [ -n "$alias" ] || { echo "::error::No private key found in the keystore."; exit 1; }
            echo "No alias secret; using the key in the file: $alias"
          fi
          if ! keytool -list -v -keystore "$ks" -storepass:env KS_PW -alias "$alias" > "$dir/cert.txt" 2> /dev/null; then
            echo "::error::Alias $alias is not in the keystore. Aliases in the file:"
            awk -F, '/Entry/ { print "  " $1 }' "$dir/list.txt"
            exit 1
          fi
          # Key password: the key password secret, else the same as the keystore password.
          key_pw="${ANDROID_KEY_PASSWORD:-$store_pw}"
          key_sha1=$(awk '/SHA1:/ { print $2; exit }' "$dir/cert.txt")
          key_sha256=$(awk '/SHA256:/ { print $2; exit }' "$dir/cert.txt")
          rm -f "$dir/list.txt" "$dir/cert.txt"

          # Pass values to later steps. Passwords go to a private file, not to the log.
          printf "%s" "$store_pw" > "$dir/store.pw"
          printf "%s" "$key_pw" > "$dir/key.pw"
          {
            echo "KEYSTORE_PATH=$ks"
            echo "KEY_ALIAS=$alias"
            echo "KEY_SOURCE=$src"
            echo "KEY_SHA1=$key_sha1"
            echo "KEY_SHA256=$key_sha256"
            echo "SIGN_DIR=$dir"
          } >> "$GITHUB_ENV"
          echo "Signing key from $src, alias $alias"
          echo "Key SHA-1:   $key_sha1"
          echo "Key SHA-256: $key_sha256"

      - name: Download Gradle (longer timeout)
        working-directory: PyPath
        run: |
          set -uo pipefail
          p=gradle/wrapper/gradle-wrapper.properties
          if grep -q "^networkTimeout=" "$p"; then
            sed -i "s/^networkTimeout=.*/networkTimeout=120000/" "$p"
          else
            echo "networkTimeout=120000" >> "$p"
          fi
          for i in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (try $i), retrying..."
            sleep 15
          done
          exit 1

      - name: Build the debug APK
        working-directory: PyPath
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ls -l app/build/outputs/apk/debug/

      - name: Sign the APK with your key and verify it
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          bt_ver=$(ls "$sdk/build-tools" | sort -V | tail -n 1)
          bt="$sdk/build-tools/$bt_ver"
          [ -x "$bt/apksigner" ] && [ -x "$bt/zipalign" ] && [ -x "$bt/aapt2" ] || { echo "::error::Android build-tools not found in $sdk"; exit 1; }
          echo "Using build-tools $bt_ver"

          in_apk=$(ls PyPath/app/build/outputs/apk/debug/*.apk | head -n 1)
          [ -s "$in_apk" ] || { echo "::error::No APK was built."; exit 1; }
          mkdir -p out
          "$bt/zipalign" -f -p 4 "$in_apk" out/aligned.apk

          pkg=$("$bt/aapt2" dump badging out/aligned.apk | awk -F"'" '/^package: name=/ { print $2; exit }')
          ver=$("$bt/aapt2" dump badging out/aligned.apk | awk -F"'" '/^package: name=/ { print $6; exit }')
          [ -n "$pkg" ] || { echo "::error::Could not read the package name from the APK."; exit 1; }
          safe_branch=$(printf "%s" "$BUILD_BRANCH" | tr -c "A-Za-z0-9._-" "-")
          name="PyPath-$safe_branch-$GITHUB_RUN_NUMBER.apk"

          "$bt/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" --ks-pass "file:$SIGN_DIR/store.pw" --key-pass "file:$SIGN_DIR/key.pw" --out "out/$name" out/aligned.apk
          rm -f out/aligned.apk out/*.idsig
          "$bt/apksigner" verify --verbose "out/$name" | grep -E "Verified|v1|v2|v3" || true
          certs=$("$bt/apksigner" verify --print-certs "out/$name")
          # Works with every build-tools format ("Signer #1 certificate ..." and "V3.0 Signer: certificate ...").
          apk_sha1=$(printf "%s" "$certs" | awk -F": " '/certificate SHA-1 digest:/ { print $NF; exit }' | tr -d " ")
          apk_sha256=$(printf "%s" "$certs" | awk -F": " '/certificate SHA-256 digest:/ { print $NF; exit }' | tr -d " ")
          [ -n "$apk_sha1" ] && [ -n "$apk_sha256" ] || { echo "::error::Could not read the fingerprints from the signed APK. apksigner said:"; echo "$certs"; exit 1; }

          norm() { printf "%s" "$1" | tr -d ":" | tr "a-f" "A-F"; }
          colon() { printf "%s" "$1" | tr "a-f" "A-F" | sed -E "s/(..)/&:/g; s/:$//"; }
          apk_sha1=$(colon "$(norm "$apk_sha1")")
          apk_sha256=$(colon "$(norm "$apk_sha256")")
          if [ "$(norm "$apk_sha1")" != "$(norm "$KEY_SHA1")" ] || [ "$(norm "$apk_sha256")" != "$(norm "$KEY_SHA256")" ]; then
            echo "::error::The APK is not signed with the key from $KEY_SOURCE (fingerprints differ)."
            echo "Key SHA-1: $KEY_SHA1  APK SHA-1: $apk_sha1"
            exit 1
          fi

          {
            echo "Package name: $pkg"
            echo "Version: $ver"
            echo "Branch: $BUILD_BRANCH ($(git rev-parse --short HEAD))"
            echo "Signing key: $KEY_SOURCE, alias $KEY_ALIAS"
            echo "SHA-1:   $apk_sha1"
            echo "SHA-256: $apk_sha256"
          } | tee out/apk-info.txt

          {
            echo "## Signed PyPath APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package name | **$pkg** |"
            echo "| SHA-1 | **$apk_sha1** |"
            echo "| SHA-256 | $apk_sha256 |"
            echo "| Signing key | $KEY_SOURCE (alias $KEY_ALIAS) |"
            echo "| Version | $ver |"
            echo "| Branch | $BUILD_BRANCH ($(git rev-parse --short HEAD)) |"
            echo "| APK | $name |"
            echo ""
            echo "The APK's signature matches the key in your secret."
            echo "For Google Sign-In: Google Cloud Console > Google Auth Platform > Clients > Create client >"
            echo "Android, package name $pkg, SHA-1 above (same project as the Web client ID)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload the signed APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PyPath-signed-apk-${{ github.run_number }}
          path: |
            out/*.apk
            out/apk-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Put the signed APK on a GitHub Release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="signed-$GITHUB_RUN_NUMBER"
          gh release create "$tag" "out/$APK_NAME" out/apk-info.txt --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title "PyPath signed APK $GITHUB_RUN_NUMBER ($BUILD_BRANCH)" --notes-file out/apk-info.txt
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$APK_NAME"
          echo "Download: $url"
          {
            echo ""
            echo "### Download on your phone"
            echo ""
            echo "[$APK_NAME]($url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the decoded key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/pypath-signing"
